[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "addrlink"
version = "0.1.0"
description = "Parse-free, inverted-index address matching (after Zhang, Churchill & Ng, arXiv:1708.01402) for Spark/Databricks and DuckDB"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.1",
    "pydantic>=2.5",
]

[project.optional-dependencies]
spark = ["pyspark>=3.5"]
dev = ["pytest>=8", "hypothesis>=6"]

[project.scripts]
addrlink = "addrlink.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["spark: needs pyspark + Java (slow)"]
