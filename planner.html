<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Planner</title>
<style>
/* ───────── tokens ───────── */
:root{
  --bg:#fcfcfb;--surface:#fff;--ink:#161615;--muted:#5c5b57;--faint:#9a9993;
  --line:#e7e6e2;--line2:#f0efec;--hover:#f5f4f1;--field:#f4f3f0;--crit:#d03b3b;
  --shadow:0 14px 44px rgba(20,20,18,.11),0 2px 6px rgba(20,20,18,.06);
  --s0:#2a78d6;--s1:#eb6834;--s2:#1baf7a;--s3:#eda100;--s4:#e87ba4;--s5:#008300;--s6:#6250d6;--s7:#e34948;
  --side:300px;--dw:20px;
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#1a1a19;--surface:#242423;--ink:#f0efec;--muted:#b1b0a7;--faint:#73726c;
  --line:#31312f;--line2:#272726;--hover:#232322;--field:#313130;
  --shadow:0 14px 44px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.35);
  --s0:#3987e5;--s1:#d95926;--s2:#199e70;--s3:#c98500;--s4:#d55181;--s5:#0ca30c;--s6:#9085e9;--s7:#e66767;
  color-scheme:dark;
}

/* ───────── base ───────── */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{
  font:13px/1.4 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
button:focus-visible,.ed:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
[hidden]{display:none!important}
body.dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}
body.dragging *{cursor:inherit!important}
.sp{flex:1 1 0;min-width:0;align-self:stretch}

/* in-place editable text */
.ed{outline:0;border-radius:5px;cursor:text;min-width:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;scroll-margin:64px 0 40px}
.ed:hover{background:color-mix(in srgb,var(--ink) 5%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 5%,transparent)}
.ed.editing{text-overflow:clip;background:var(--surface);box-shadow:0 0 0 3px var(--surface),0 0 0 4px var(--ink)}
.ed:empty::before{content:attr(data-ph);color:var(--faint)}

/* ───────── header ───────── */
.top{display:flex;align-items:center;gap:14px;min-height:52px;padding:0 14px;border-bottom:1px solid var(--line);flex:none}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 0}
.logo{flex:none;width:18px;display:grid;gap:2.5px}
.logo i{display:block;height:3px;border-radius:2px;background:var(--ink)}
.logo i:nth-child(1){width:9px}.logo i:nth-child(2){width:10px;margin-left:5px;opacity:.55}.logo i:nth-child(3){width:7px;margin-left:11px;opacity:.3}
.title{font-size:14px;font-weight:600;letter-spacing:-.01em}
.tabs{display:flex;gap:2px;flex:none}
.tabs button{position:relative;padding:6px 12px;border-radius:8px;color:var(--muted);font-weight:500}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);background:var(--hover)}
.badge{position:absolute;top:6px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--crit)}
.right{display:flex;align-items:center;gap:6px;flex:1 1 0;justify-content:flex-end;min-width:0}
.ctx{display:flex;align-items:center;gap:8px;margin-right:6px}
.ib{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted);flex:none}
.ib:hover{background:var(--hover);color:var(--ink)}
.ib:disabled{opacity:.28;pointer-events:none}
.tb{padding:5px 11px;border-radius:8px;color:var(--muted);font-weight:500;box-shadow:inset 0 0 0 1px var(--line)}
.tb:hover{color:var(--ink);background:var(--hover)}
.seg{display:inline-flex;padding:2px;gap:2px;border-radius:9px;background:var(--hover)}
.seg button{padding:4px 10px;border-radius:7px;color:var(--muted);font-weight:500;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(0,0,0,.05)}
input[type=range]{-webkit-appearance:none;appearance:none;height:18px;margin:0;background:none;cursor:pointer;min-width:0}
input[type=range]::-webkit-slider-runnable-track{height:2px;border-radius:2px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;margin-top:-5px;border-radius:50%;background:var(--ink);border:0}
input[type=range]::-moz-range-track{height:2px;border-radius:2px;background:var(--line)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--ink);border:0}
.zoom{width:84px}

/* ───────── view shell ───────── */
#view{flex:1 1 0;min-height:0;overflow:auto;position:relative;isolation:isolate;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.addb{display:inline-flex;align-items:center;gap:6px;color:var(--faint);font-weight:500;padding:5px 8px;border-radius:7px;white-space:nowrap}
.addb:hover{color:var(--ink);background:var(--hover)}
.gb{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--faint);flex:none;opacity:0}
.gb:hover{background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--ink)}
.row:hover .gb,.pn:hover .gb,.gb:focus-visible{opacity:1}
@media (hover:none){.gb{opacity:1}}
.av{width:22px;height:22px;border-radius:50%;flex:none;display:inline-grid;place-items:center;font-size:9.5px;font-weight:600;letter-spacing:.02em;
  background:color-mix(in srgb,var(--ink) 10%,var(--bg));color:var(--muted)}
.av.none{background:none;box-shadow:inset 0 0 0 1px var(--faint);opacity:.55;border-radius:50%}
.av.none::after{content:"";width:8px;height:1px;background:var(--faint)}
button.av:hover{box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--ink);opacity:1}
.pd{width:10px;height:10px;border-radius:3.5px;background:var(--c);flex:none;display:inline-block}
button.pd:hover{box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--ink)}
.warn{color:var(--crit);font-weight:600}

/* ───────── plan ───────── */
.p-head{display:flex;position:sticky;top:0;z-index:6;height:52px;background:var(--bg);border-bottom:1px solid var(--line)}
.corner{position:sticky;left:0;z-index:2;flex:0 0 var(--side);background:var(--bg);border-right:1px solid var(--line);display:flex;align-items:center;padding:0 10px}
.axis{position:relative;flex:none}
.mo{position:absolute;top:0;height:28px;border-left:1px solid var(--line)}
.mo span{position:sticky;left:calc(var(--side) + 1px);display:inline-block;padding:8px 10px 0;font-size:12px;font-weight:600;white-space:nowrap}
.tk{position:absolute;top:29px;height:20px;line-height:20px;font-size:11px;color:var(--muted);text-align:center;white-space:nowrap}
.tk.we{color:var(--faint)}
.tk.w7{text-align:left;padding-left:4px}
.tk b{font-weight:400;color:var(--faint);margin-right:3px}
.nowp{position:absolute;top:29px;transform:translateX(-50%);min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--ink);color:var(--bg);
  font-size:11px;font-weight:600;line-height:20px;text-align:center;z-index:1;white-space:nowrap}
.p-body{position:relative;min-height:calc(100% - 52px)}
.nowl{position:absolute;top:0;bottom:0;width:1px;background:var(--ink);opacity:.22;z-index:1;pointer-events:none}
.links{position:absolute;top:0;z-index:1;pointer-events:none;overflow:visible}
.links.fade{animation:fade .45s ease-out}
@keyframes fade{0%,45%{opacity:0}}
.link .vis{stroke:var(--faint);stroke-width:1.25;fill:none}
.link .hit{stroke:transparent;stroke-width:12;fill:none;pointer-events:stroke;cursor:pointer}
.link.rel .vis{stroke:var(--ink);marker-end:url(#arr-on)}
.link:hover .vis{stroke:var(--crit);stroke-width:1.75;marker-end:url(#arr-x)}
.links marker path{fill:var(--faint)}
.links #arr-on path{fill:var(--ink)}
.links #arr-x path{fill:var(--crit)}
.links.quiet .link:not(.rel){display:none}
.links.quiet~.grp .bar .dot{display:none}
.links .temp{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:4 3;fill:none}
#view.busy .link{opacity:.25}

.grp{border-bottom:1px solid var(--line)}
.row{display:flex}
.side{position:sticky;left:0;z-index:3;flex:0 0 var(--side);width:var(--side);min-width:0;background:var(--bg);border-right:1px solid var(--line);
  display:flex;align-items:center;gap:8px;padding:0 8px 0 4px}
.track{position:relative;flex:none;
  background-image:linear-gradient(to right,transparent calc(5 * var(--dw)),color-mix(in srgb,var(--ink) 2.6%,transparent) calc(5 * var(--dw))),
                   linear-gradient(to right,var(--line2) 1px,transparent 1px);
  background-size:calc(7 * var(--dw)) 100%}
.row.ghead{height:42px}
.row.task{height:36px}
.row.add{height:32px}
.row.newg{height:48px}
.row.task:hover .side{background:var(--hover)}
.row.task:hover .track{background-color:color-mix(in srgb,var(--ink) 2.2%,transparent)}
body.dragging .grp:not(.drop) .row.task:not(.sel):hover .side{background:var(--bg)}
body.dragging .row.task:hover .track{background-color:transparent}
body.dragging .row .grip{opacity:0}
.row.task.sel .side{background:var(--hover)}
.row.lift{opacity:.35}
.grp.drop .side{background:color-mix(in srgb,var(--ink) 6%,var(--bg))}
.grp.drop .track{background-color:color-mix(in srgb,var(--ink) 4%,transparent)}
.ins{display:block;height:0;position:relative;z-index:5}
.ins::after{content:"";position:absolute;left:0;right:0;top:-1px;height:2px;background:var(--ink)}

.chev{width:18px;height:22px;display:grid;place-items:center;color:var(--faint);flex:none;border-radius:5px;transition:transform .15s}
.chev:hover{color:var(--ink)}
.chev.closed{transform:rotate(-90deg)}
.gname{font-weight:600;letter-spacing:-.005em;flex:0 1 auto}
.meta{color:var(--faint);font-size:11.5px;white-space:nowrap;flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis}
.meta.warn{min-width:max-content}
.grip{width:10px;height:18px;flex:none;cursor:grab;opacity:0;touch-action:none;
  background:radial-gradient(circle,var(--faint) 1px,transparent 1.3px) 0 1px/5px 5px}
.row:hover .grip{opacity:1}
.st{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--faint);flex:none;position:relative}
.st:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.st.doing{background:conic-gradient(var(--ink) calc(var(--p) * 1%),transparent 0);box-shadow:inset 0 0 0 1.5px var(--ink),inset 0 0 0 3.5px var(--bg)}
.row.task:hover .st.doing,.row.task.sel .st.doing{box-shadow:inset 0 0 0 1.5px var(--ink),inset 0 0 0 3.5px var(--hover)}
.st.done{background:var(--ink);box-shadow:none}
.st.done::after{content:"";position:absolute;left:5.5px;top:3px;width:3.5px;height:7px;border:solid var(--bg);border-width:0 1.5px 1.5px 0;transform:rotate(42deg)}
.row.task.done .tname{color:var(--faint)}
.row.add .addb{margin-left:14px}
.row.newg .addb{margin-left:0}

.bar{position:absolute;top:7px;height:22px;line-height:22px;font-size:12px;border-radius:6px;z-index:2;cursor:grab;
  background:color-mix(in srgb,var(--c) 24%,var(--bg));user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.bar .fw{position:absolute;inset:0;border-radius:6px;overflow:hidden;pointer-events:none}
.bar .fill{display:block;height:100%;background:color-mix(in srgb,var(--c) 58%,var(--bg))}
.bar .lbl{position:sticky;left:var(--side);display:inline-block;vertical-align:top;padding:0 8px;line-height:22px;font-size:12px;font-weight:500;white-space:nowrap;pointer-events:none;color:var(--ink)}
.bar.out .lbl{position:absolute;left:calc(100% + 17px);top:0;padding:0;color:var(--muted)}
.bar .h{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize}
.bar .h-l{left:0}.bar .h-r{right:0}
@media (pointer:coarse){.bar .h{width:14px}}
.bar .dot{position:absolute;right:-13px;top:50%;margin-top:-4.5px;width:9px;height:9px;border-radius:50%;background:var(--bg);
  box-shadow:inset 0 0 0 1.5px var(--muted);opacity:0;cursor:crosshair;transition:opacity .12s}
.bar:hover .dot,.bar.sel .dot,.bar.linking .dot{opacity:1}
.bar .dot:hover{box-shadow:inset 0 0 0 1.5px var(--ink),0 0 0 3px color-mix(in srgb,var(--ink) 12%,transparent)}
.bar:hover{filter:brightness(.97)}
.bar.sel,.bar.hot{box-shadow:0 0 0 1.5px var(--ink)}
.bar.drag{cursor:grabbing;pointer-events:none;box-shadow:var(--shadow);z-index:2}
.bar.linking{pointer-events:none}
.bar.ghost{top:5px;background:none;box-shadow:inset 0 0 0 1.5px var(--muted);pointer-events:none}
.bar.ghost.hov{box-shadow:inset 0 0 0 1.5px var(--faint);opacity:.6}
.row.add>.track{cursor:copy}
.bar.ms{top:10px;height:16px;background:none}
.bar.ms .dia{position:absolute;inset:2px;border-radius:2.5px;transform:rotate(45deg);background:var(--bg);box-shadow:inset 0 0 0 2px var(--c)}
.bar.ms.done .dia{background:var(--c)}
.bar.ms .lbl{line-height:16px}
.bar.ms.sel,.bar.ms.hot{box-shadow:none}
.bar.ms.sel .dia,.bar.ms.hot .dia{box-shadow:inset 0 0 0 2px var(--c),0 0 0 2px var(--bg),0 0 0 3.5px var(--ink)}
.sum{position:absolute;top:19px;height:4px;border-radius:2px;background:color-mix(in srgb,var(--c) 28%,var(--bg))}
.sum i{display:block;height:100%;border-radius:2px;background:var(--c)}
.hb{position:absolute;bottom:6px;border-radius:2px 2px 0 0;background:color-mix(in srgb,var(--ink) 20%,var(--bg))}
.hb:hover{background:color-mix(in srgb,var(--ink) 32%,var(--bg))}
.hb.x{background:var(--crit);pointer-events:none}
.capl{position:absolute;left:0;right:0;bottom:22px;border-top:1px dashed var(--line);pointer-events:none}

.empty{position:sticky;left:0;width:min(100vw,460px);padding:28px 22px;color:var(--muted);line-height:1.6}
.empty b{display:block;color:var(--ink);font-size:14px;font-weight:600;margin-bottom:2px}
.hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:12px;max-width:calc(100vw - 24px);
  padding:8px 8px 8px 14px;border-radius:11px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--muted);font-size:12px}
.hint b{color:var(--ink);font-weight:600}
.hint button{width:22px;height:22px;border-radius:6px;color:var(--faint);flex:none;font-size:15px;line-height:1}
.hint button:hover{background:var(--field);color:var(--ink)}

/* ───────── board ───────── */
.board{display:flex;gap:14px;padding:22px 20px 80px;align-items:flex-start;width:max-content;min-width:100%;max-width:max(100%,1240px);margin:0 auto}
.col{flex:1 1 0;width:300px;min-width:250px;max-width:400px;display:flex;flex-direction:column;gap:8px;padding:6px;border-radius:14px;transition:background .15s}
.col.drop{background:var(--hover)}
.col header{display:flex;align-items:center;gap:8px;padding:6px 8px 4px;font-weight:600}
.col header .n{color:var(--faint);font-weight:500}
.cards{display:flex;flex-direction:column;gap:8px;min-height:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px 12px;display:flex;flex-direction:column;gap:7px;cursor:grab;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.card:hover{border-color:color-mix(in srgb,var(--ink) 22%,var(--line))}
.card.sel{box-shadow:0 0 0 1.5px var(--ink);border-color:transparent}
.card .cp{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted);min-width:0}
.card .cp span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .tag{margin-left:auto;font-size:10.5px;color:var(--faint);flex:none}
.card .cn{font-weight:500;line-height:1.35;white-space:normal;overflow:visible;align-self:flex-start;max-width:100%;overflow-wrap:anywhere}
.card.done .cn{color:var(--faint)}
.card .cm{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
.card .pb{width:44px;height:3px;border-radius:2px;background:var(--line);overflow:hidden;flex:none}
.card .pb i{display:block;height:100%;background:var(--ink);border-radius:2px}
.card.float{position:fixed;z-index:60;pointer-events:none;box-shadow:var(--shadow);transform:rotate(1.6deg);margin:0;cursor:grabbing}
.card.ph{background:none;border:1.5px dashed var(--line);box-shadow:none}
.col .addb{align-self:flex-start}

/* ───────── people ───────── */
.people{padding:22px 20px 80px;width:max-content;min-width:100%}
.pw{width:max-content;margin:0 auto}
.pt{display:grid;column-gap:3px;row-gap:5px;align-items:center;width:max-content}
.pn{position:sticky;left:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:10px;min-width:0;height:40px;padding-right:8px}
.pn.hd,.pc.hd{height:40px;color:var(--faint);font-size:11.5px;align-self:end;display:flex;align-items:flex-end;padding-bottom:6px}
.pnn{display:flex;flex-direction:column;align-items:flex-start;min-width:0;flex:0 1 auto;gap:1px}
.pnn .ed{max-width:100%;font-weight:500}
.pnn .role{font-weight:400;font-size:11.5px;color:var(--muted)}
.pc{font-size:12px;color:var(--muted);padding-right:8px}
.pc.hd{justify-content:flex-start}
.wk{height:40px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;padding-bottom:4px;font-size:11px;color:var(--muted)}
.wk small{font-size:10.5px;color:var(--faint);height:13px;white-space:nowrap}
.wk b{font-weight:500;min-width:20px;height:20px;line-height:20px;text-align:center;border-radius:10px}
.wk.cur b{background:var(--ink);color:var(--bg);font-weight:600}
.cell{height:38px;border-radius:7px;font-size:11.5px;font-weight:500;color:var(--ink);display:grid;place-items:center;position:relative;width:100%}
button.cell:hover,.cell.open{box-shadow:0 0 0 1.5px var(--ink)}
.cell.zero::after{content:"";width:3px;height:3px;border-radius:50%;background:var(--line)}
.cell.over{font-weight:700}
.cell.spike::before{content:"";position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--crit)}
.pt .rule{grid-column:1/-1;height:1px;background:var(--line);margin:4px 0}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;margin:22px 0 0;color:var(--muted);font-size:11.5px;position:sticky;left:12px;width:fit-content;max-width:calc(100vw - 40px)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;position:relative}
.legend .ramp{width:64px;background:linear-gradient(to right,color-mix(in srgb,var(--ink) 5%,var(--bg)),color-mix(in srgb,var(--ink) 28%,var(--bg)))}
.legend .ov{background:color-mix(in srgb,var(--crit) 42%,var(--bg))}
.legend .sk{background:color-mix(in srgb,var(--ink) 14%,var(--bg))}
.legend .sk::before{content:"";position:absolute;top:2px;right:2px;width:4px;height:4px;border-radius:50%;background:var(--crit)}

/* ───────── popovers ───────── */
.pop{position:fixed;z-index:80;background:var(--surface);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);animation:pop .13s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(4px) scale(.985)}}
.menu{min-width:190px;max-width:320px;padding:5px;max-height:min(70vh,480px);overflow:auto}
.mi{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border-radius:8px;text-align:left}
.mi:hover{background:var(--field)}
.mi>span{flex:1 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi small{color:var(--faint);font-size:11.5px;flex:none}
.mi svg{color:var(--muted);flex:none}
.mi.danger{color:var(--crit)}
.msep{height:1px;background:var(--line);margin:5px 4px}
.mh{padding:7px 9px 5px;font-size:11.5px;color:var(--muted)}
.sw{display:flex;gap:7px;padding:8px 9px}
.sw button{width:18px;height:18px;border-radius:6px;background:var(--c)}
.sw button.on{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--ink)}

.insp{width:364px;padding:14px 14px 10px}
.i-name{display:block;width:100%;border:0;background:none;outline:0;padding:0 0 12px;font-family:inherit;font-size:15px;font-weight:600;line-height:1.3;color:var(--ink);letter-spacing:-.01em}
.ig{display:grid;grid-template-columns:66px minmax(0,1fr);gap:8px 8px;align-items:center}
.ig>label{color:var(--muted);font-size:12px}
.insp select,.insp input[type=date]{font:inherit;color:var(--ink);background:var(--field);border:0;border-radius:8px;padding:6px 8px;min-width:0;width:100%;height:30px;outline-offset:0}
.insp input[type=date]{padding:6px 6px 6px 8px;flex:1 1 0}
.i-dates{display:flex;align-items:center;gap:6px;min-width:0}
.i-dates span{color:var(--faint)}
.i-note{font-size:11.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:-3px}
.i-range{display:flex;align-items:center;gap:10px}
.i-range input{flex:1}
.i-range output{width:36px;text-align:right;color:var(--muted);font-size:12px}
.insp .seg{width:100%;background:var(--field)}
.insp .seg button{flex:1;padding:5px 4px}
.i-deps{display:flex;flex-wrap:wrap;gap:5px;align-items:center;min-width:0}
.chip{display:inline-flex;align-items:center;gap:4px;max-width:100%;padding:3px 4px 3px 9px;border-radius:8px;background:var(--field);font-size:12px}
.chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip button{width:18px;height:18px;border-radius:5px;color:var(--faint);flex:none;line-height:1}
.chip button:hover{color:var(--crit);background:var(--surface)}
.i-deps select{width:auto;max-width:150px;color:var(--muted)}
.i-foot{display:flex;align-items:center;gap:4px;margin:12px -4px 0;padding-top:8px;border-top:1px solid var(--line)}
.i-foot button{padding:5px 9px;border-radius:7px;color:var(--muted);font-weight:500}
.i-foot button:hover{background:var(--field);color:var(--ink)}
.i-foot button.danger:hover{color:var(--crit)}
.chk{display:inline-flex;align-items:center;gap:7px;padding:5px 6px;color:var(--muted);font-weight:500;cursor:pointer}
.chk input{accent-color:var(--ink);margin:0;width:14px;height:14px}
.is-ms .nm{display:none}

.tip{position:fixed;z-index:90;pointer-events:none;background:var(--ink);color:var(--bg);font-size:11.5px;font-weight:500;padding:4px 8px;border-radius:7px;white-space:nowrap}

  background:var(--ink);color:var(--bg);font-weight:500;box-shadow:var(--shadow);transition:opacity .2s,transform .2s;max-width:calc(100vw - 24px);white-space:nowrap}

.toast.hide{opacity:0;pointer-events:none;transform:translate(-50%,8px)}
.hint:not([hidden])~.toast{bottom:66px}
.toast button{padding:3px 9px;border-radius:7px;background:color-mix(in srgb,var(--bg) 16%,transparent);font-weight:600}

<script>
(() => {
'use strict';

/* ───────── helpers ───────── */

const uid = () => Math.random().toString(36).slice(2, 9);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const svg = (d, s = 16) => `<svg viewBox="0 0 16 16" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;

const NCOL = 8, FONT = 'Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif';
const STATUS = { todo: 'To do', doing: 'In progress', done: 'Done' };

/* dates are integer day numbers (days since 1970-01-01, UTC) */
const DAY = 864e5;
const toDay = iso => { const m = /^(\d{4})-(\d\d)-(\d\d)/.exec(iso || ''); return m ? Math.round(Date.UTC(+m[1], +m[2] - 1, +m[3]) / DAY) : NaN; };

const today = () => { const d = new Date(); return Math.round(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / DAY); };

const dow = n => ((n + 3) % 7 + 7) % 7;               // 0 = Monday … 6 = Sunday

const FC = {};
const fmt = (n, o) => { const k = JSON.stringify(o); return (FC[k] || (FC[k] = new Intl.DateTimeFormat(undefined, { ...o, timeZone: 'UTC' }))).format(new Date(n * DAY)); };

const span = (a, b) => a === b ? dS(a) : `${dS(a)} → ${dS(b)}`;

/* ───────── state ───────── */
const KEY = 'planner.v1';
const view = $('#view'), ctxEl = $('#ctx'), tipEl = $('#tip'), toastEl = $('#toast'), hintEl = $('#hint');
const measure = document.createElement('canvas').getContext('2d');

let data;
let ui = { view: 'plan', group: 'project', dayW: 20, theme: 'auto', collapsed: {}, weekOff: 0, hint: true };
let undoS = [], redoS = [], snap = '', lastTag = '', lastAt = 0;
let selId = null, pop = null, closedBy = {}, P = null, needScroll = true;
let flip = { sig: '', pos: {} }, flipSeed = null;
let busy = false, dragging = false, eatClick = false, ptrDown = false, pend = false;

const task = id => data.tasks.find(t => t.id === id);
const project = id => data.projects.find(p => p.id === id);
const person = id => data.people.find(p => p.id === id);
const ck = k => k || '_';

function sample() {
  const m = monday(today());
  const T = (id, proj, name, who, s, e, o) => Object.assign({ id, project: proj, name, who, start: m + s, end: m + e, load: 100, status: 'todo', progress: 0, milestone: false, deps: [] }, o);
  return {
    title: 'Data platform roadmap',
    projects: [
      { id: 'p1', name: 'Lakehouse migration', color: 0 },
      { id: 'p2', name: 'Customer 360', color: 2 },
      { id: 'p3', name: 'Risk reporting uplift', color: 1 },
    ],
    people: [
      { id: 'w1', name: 'Ava Chen', role: 'Data engineer', cap: 100 },
      { id: 'w2', name: 'Liam Patel', role: 'Analytics engineer', cap: 100 },
      { id: 'w3', name: 'Noor Haddad', role: 'Data scientist', cap: 80 },
      { id: 'w4', name: 'Sam Okafor', role: 'Platform engineer', cap: 100 },
      { id: 'w5', name: 'Mia Rossi', role: 'BI developer', cap: 60 },
    ],
    tasks: [
      T('a1', 'p1', 'Source system audit', 'w1', -14, -8, { status: 'done', progress: 100, load: 80 }),
      T('a2', 'p1', 'Ingestion framework', 'w4', -7, 8, { status: 'doing', progress: 60, deps: ['a1'] }),
      T('a3', 'p1', 'Bronze to silver pipelines', 'w1', 9, 25, { load: 60, deps: ['a2'] }),
      T('a4', 'p1', 'Catalog and access model', 'w4', 9, 18, { load: 80, deps: ['a2'] }),
      T('a5', 'p1', 'Cutover', 'w4', 28, 28, { milestone: true, deps: ['a3', 'a4'] }),
      T('b1', 'p2', 'Identity resolution rules', 'w3', -3, 8, { status: 'doing', progress: 35, load: 80 }),
      T('b2', 'p2', 'Gold customer model', 'w2', 9, 22, { load: 80, deps: ['b1'] }),
      T('b3', 'p2', 'Churn features', 'w3', 9, 23, { load: 80, deps: ['b1'] }),
      T('b4', 'p2', 'Executive dashboard', 'w5', 23, 36, { load: 60, deps: ['b2'] }),
      T('b5', 'p2', 'Launch', 'w5', 37, 37, { milestone: true, deps: ['b4'] }),
      T('c1', 'p3', 'Requirements and lineage map', 'w2', -11, -3, { status: 'done', progress: 100 }),
      T('c2', 'p3', 'Data quality rules', 'w2', 0, 11, { status: 'doing', progress: 25, load: 60, deps: ['c1'] }),
      T('c3', 'p3', 'Reconciliation engine', 'w1', 14, 25, { load: 40, deps: ['c2'] }),
      T('c4', 'p3', 'Regulator dry run', 'w4', 28, 32, { load: 50, deps: ['c3'] }),
      T('c5', 'p3', 'Submission', null, 35, 35, { milestone: true, deps: ['c4'] }),
    ],
  };
}

/* accept anything shaped roughly like a plan (ISO dates or day numbers) and make it safe */
function normalize(d) {
  const t0 = today();
  const day = v => { const n = typeof v === 'number' ? v : toDay(String(v)); return isNaN(n) ? t0 : clamp(Math.round(n), MIN_DAY, MAX_DAY); };
  const out = {
    title: String(d.title || 'Untitled plan'),
    projects: (d.projects || []).map((p, i) => ({ id: String(p.id || uid()), name: String(p.name || 'Project'), color: Number.isInteger(p.color) ? ((p.color % NCOL) + NCOL) % NCOL : i % NCOL })),
    people: (d.people || []).map(p => ({ id: String(p.id || uid()), name: String(p.name || 'Person'), role: String(p.role || ''), cap: clamp(Math.round(+p.cap) || 100, 5, 100) })),
    tasks: (d.tasks || []).map(t => {
      const s = day(t.start), e = Math.max(s, day(t.end == null ? t.start : t.end)), ms = !!t.milestone;
      return { id: String(t.id || uid()), project: String(t.project || ''), name: String(t.name || 'Untitled'), who: t.who ? String(t.who) : null,
        start: s, end: ms ? s : e, load: clamp(Math.round(+t.load) || 100, 5, 100), status: STATUS[t.status] ? t.status : 'todo',
        progress: clamp(Math.round(+t.progress) || 0, 0, 100), milestone: ms, deps: Array.isArray(t.deps) ? t.deps.map(String) : [] };
    }),
  };
  if (!out.projects.length && out.tasks.length) out.projects.push({ id: uid(), name: 'Project', color: 0 });
  const ps = new Set(out.projects.map(p => p.id)), ws = new Set(out.people.map(p => p.id)), ts = new Set(out.tasks.map(t => t.id));
  for (const t of out.tasks) {
    if (!ps.has(t.project)) t.project = out.projects[0].id;
    if (!ws.has(t.who)) t.who = null;
    t.deps = t.deps.filter(x => ts.has(x) && x !== t.id);
  }

}
const serialize = () => ({ ...data, tasks: data.tasks.map(t => ({ ...t, start: toISO(t.start), end: toISO(t.end) })) });

function save() { try { localStorage.setItem(KEY, JSON.stringify({ data, ui })); } catch (e) { /* storage unavailable: keep working in memory */ } }
let saveT = 0;
const saveSoon = () => { clearTimeout(saveT); saveT = setTimeout(save, 300); };
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.data && Array.isArray(s.data.tasks)) { data = normalize(s.data); Object.assign(ui, s.ui); ui.dayW = clamp(+ui.dayW || 20, 5, 48); ui.collapsed = ui.collapsed || {}; return true; }

/* every change goes through commit(): snapshot for undo, persist, repaint */
function commit(tag, soft) {
  const now = Date.now();
  if (!(tag && tag === lastTag && now - lastAt < 1500)) { undoS.push(snap); if (undoS.length > 200) undoS.shift(); redoS = []; }

}
function restore(from, to) {
  if (!from.length) return;
  to.push(snap); snap = from.pop(); data = JSON.parse(snap); lastTag = ''; save();

  render();
}
/* a blur-triggered repaint must not swap the DOM out from under a click that is still in flight */
function renderSoon() { if (ptrDown) pend = true; else setTimeout(render, 0); }
addEventListener('pointerdown', () => { ptrDown = true; }, true);
const ptrUp = () => { ptrDown = false; if (pend) { pend = false; setTimeout(render, 0); } };
addEventListener('pointerup', ptrUp, true);
addEventListener('pointercancel', ptrUp, true);

/* ───────── scheduling ───────── */

}

function cascade(ids) {                                 // push successors along
  const q = [...ids]; let n = 0;

function setStatus(t, s) { t.status = s; if (s === 'done') t.progress = 100; else if (s === 'todo') t.progress = 0; else if (t.progress >= 100) t.progress = 50; }

/* load = % of a working day a task takes; capacity = % of full time a person works */
function loadMap(pid) {
  const m = new Map();
  for (const t of data.tasks) if ((t.who || '') === pid && !t.milestone)

}
function peak(m, cap, a, b) { let p = 0; for (let d = a; d <= b; d++) p = Math.max(p, m.get(d) || 0); return p / cap; }

function overRange(t) {

/* ───────── mutations ───────── */
function defStart() {
  const t0 = workday(today());
  if (ui.view !== 'plan' || !P) return t0;
  const a = P.origin + view.scrollLeft / P.dw, b = a + (view.clientWidth - P.side) / P.dw;
  return t0 >= a && t0 <= b - 3 ? t0 : workday(Math.ceil(a) + 1);

const sameGroup = t => ui.view === 'board' ? x => x.status === t.status
  : ui.view === 'plan' && ui.group === 'person' ? x => (x.who || '') === (t.who || '')
  : x => x.project === t.project;
function place(t, same) {                               // put t after the last task of its group
  const a = data.tasks, i0 = a.indexOf(t); if (i0 >= 0) a.splice(i0, 1);
  let i = a.length;
  for (let j = a.length - 1; j >= 0; j--) if (same(a[j])) { i = j + 1; break; }
  a.splice(i, 0, t);
}
function addTask(o = {}, edit = true) {
  if (!data.projects.length) data.projects.push({ id: uid(), name: 'New project', color: 0 });
  const s = o.start == null ? defStart() : o.start, ms = !!o.milestone;
  const t = { id: uid(), project: o.project || data.projects[0].id, name: ms ? 'New milestone' : 'New task', who: o.who || null,
    start: s, end: ms ? s : o.end == null ? s + 4 : Math.max(s, o.end), load: 100, status: o.status || 'todo',
    progress: o.status === 'done' ? 100 : 0, milestone: ms, deps: [] };

  if (ui.view === 'plan') delete ui.collapsed[ck(ui.group === 'project' ? t.project : t.who)];

}
function delTask(id) {
  const t = task(id); if (!t) return;
  data.tasks = data.tasks.filter(x => x !== t);
  data.tasks.forEach(x => { x.deps = x.deps.filter(d => d !== id); });
  if (selId === id) closePop();
  commit(); toast(`Deleted “${t.name}”`, true);
}
function dupTask(id) {
  const t = task(id); if (!t) return;
  const c = { ...t, id: uid(), name: t.name + ' copy', deps: [...t.deps] };
  data.tasks.splice(data.tasks.indexOf(t) + 1, 0, c);
  commit(); openTask(c.id, null, true);
}
function addProject() {
  const used = new Set(data.projects.map(p => p.color));
  let c = 0; while (used.has(c) && c < NCOL) c++;
  const p = { id: uid(), name: 'New project', color: c < NCOL ? c : data.projects.length % NCOL };
  data.projects.push(p); commit(); editKey('project.name:' + p.id);
}
function delProject(id) {
  const p = project(id); if (!p) return;
  const gone = new Set(data.tasks.filter(t => t.project === id).map(t => t.id));
  data.projects = data.projects.filter(x => x !== p);
  data.tasks = data.tasks.filter(t => !gone.has(t.id));
  data.tasks.forEach(t => { t.deps = t.deps.filter(d => !gone.has(d)); });
  closePop(); commit(); toast(`Deleted “${p.name}” and ${plural(gone.size, 'task')}`, true);
}
function addPerson() { const p = { id: uid(), name: 'New person', role: '', cap: 100 }; data.people.push(p); commit(); editKey('person.name:' + p.id); }
function delPerson(id) {
  const p = person(id); if (!p) return;
  data.people = data.people.filter(x => x !== p);
  data.tasks.forEach(t => { if (t.who === id) t.who = null; });
  closePop(); commit(); toast(`Removed ${p.name}`, true);
}

/* ───────── in-place text editing ───────── */
function setCaret(el, off) {

    end() {
      const t = task(id), a = data.tasks, c = ph.closest('.col'), nx = ph.nextElementSibling, pv = ph.previousElementSibling;
      card.remove();
      const st = c.dataset.status; if (t.status !== st) setStatus(t, st);
      a.splice(a.indexOf(t), 1);
      if (nx) a.splice(a.findIndex(x => x.id === nx.dataset.id), 0, t);
      else if (pv) a.splice(a.findIndex(x => x.id === pv.dataset.id) + 1, 0, t);
      else a.push(t);

    },
    cancel() { card.remove(); render(); },
  });
}
let hov = null;
const dropHov = () => { if (hov) { hov.remove(); hov = null; } };
view.addEventListener('pointermove', e => {                // preview where a click would add a task
  if (dragging || e.pointerType !== 'mouse' || ui.view !== 'plan' || !P) return;
  const tr = e.target.closest('.row.add > .track');
  if (!tr) { dropHov(); return; }
  if (!hov || hov.parentElement !== tr) { dropHov(); hov = document.createElement('div'); hov.className = 'bar ghost hov'; tr.appendChild(hov); }
  hov.style.left = P.X(Math.floor(dayF(e.clientX))) + 1 + 'px'; hov.style.width = 5 * P.dw - 2 + 'px';
});
view.addEventListener('pointerleave', dropHov);
view.addEventListener('pointerdown', e => {
  if (e.button !== 0 || e.target.closest('.editing')) return;
  const t = e.target;
  if (ui.view === 'plan' && P) {
    const bar = t.closest('.bar'); if (bar) { dragBar(e, bar); return; }
    const grip = t.closest('.grip'); if (grip) { dragRow(e, grip.closest('.row')); return; }
    const add = t.closest('.row.add > .track'); if (add) { dragDraw(e, add); return; }
    if (e.pointerType === 'mouse' && t.closest('.track') && !t.closest('[data-act]')) dragPan(e);
  } else if (ui.view === 'board') {
    const card = t.closest('.card'); if (card && !t.closest('button')) dragCard(e, card);
  }
});

/* ───────── clicks ───────── */
function setView(v) {
  if (ui.view === v) return;
  closePop(); ui.view = v; P = null; flip = { sig: '', pos: {} }; needScroll = true; save();
  view.scrollTo(0, 0); chrome(); render();
}
function toToday(smooth) { if (P) view.scrollTo({ left: P.X(today()) - (view.clientWidth - P.side) * .22, behavior: smooth && !reduced ? 'smooth' : 'auto' }); }
function setZoom(dw, px) {
  if (!P) return;
  dw = clamp(dw, 5, 48);
  if (px == null) px = (view.clientWidth - P.side) / 2;
  const d = (view.scrollLeft + px) / P.dw;
  ui.dayW = dw; render(); view.scrollLeft = d * dw - px; saveSoon();
}
function act(name, el) {
  const grp = el.closest('.grp'), key = grp ? grp.dataset.group : null;
  const holder = el.closest('[data-id]'), id = holder ? holder.dataset.id : null;
  switch (name) {
    case 'view': setView(el.dataset.v); break;
    case 'group': if (ui.group !== el.dataset.v) { ui.group = el.dataset.v; closePop(); save(); render(); } break;
    case 'today': if (ui.view === 'people') { ui.weekOff = 0; save(); render(); } else toToday(true); break;
    case 'wk': ui.weekOff += +el.dataset.d; closePop(); save(); render(); break;
    case 'undo': restore(undoS, redoS); break;
    case 'redo': restore(redoS, undoS); break;
    case 'toast-undo': toastEl.classList.add('hide'); restore(undoS, redoS); break;
    case 'menu': mainMenu(el); break;
    case 'mi': { const fn = pop && pop.on && pop.on[+el.dataset.i]; closePop(); if (fn) fn(); break; }
    case 'hint-x': ui.hint = false; save(); hintEl.hidden = true; break;
    case 'toggle': if (ui.collapsed[ck(key)]) delete ui.collapsed[ck(key)]; else ui.collapsed[ck(key)] = 1; save(); render(); break;
    case 'add-task': addTask(ui.group === 'project' ? { project: key } : { who: key || null }); break;
    case 'add-group': if (ui.group === 'project') addProject(); else addPerson(); break;
    case 'add-person': addPerson(); break;
    case 'add-card': addTask({ status: el.closest('.col').dataset.status }); break;
    case 'group-menu': groupMenu(el, key); break;
    case 'person-menu': personMenu(el, id); break;
    case 'cycle': { const t = task(id); if (t) { setStatus(t, { todo: 'doing', doing: 'done', done: 'todo' }[t.status]); commit(); } break; }
    case 'pick-who': whoMenu(el, id); break;
    case 'pick-project': projMenu(el, id); break;
    case 'cell': cellMenu(el); break;
    case 'rm-link': { const t = task(el.dataset.to); if (t) { t.deps = t.deps.filter(d => d !== el.dataset.from); commit(); toast('Dependency removed', true); } break; }
    case 'status': { const t = pop && task(pop.id); if (t) { setStatus(t, el.dataset.v); commit(); } break; }
    case 'rm-dep': { const t = pop && task(pop.id); if (t) { t.deps = t.deps.filter(d => d !== el.dataset.dep); commit(); } break; }
    case 'dup': if (pop) dupTask(pop.id); break;
    case 'del': if (pop) delTask(pop.id); break;
  }
}
document.addEventListener('pointerdown', e => {
  if (!pop || e.target.closest('.pop')) return;
  const a = pop.kind === 'task' && pop.anchor ? pop.anchor() : null;
  closedBy = { id: pop.kind === 'task' ? pop.id : null, src: pop.src || null, at: Date.now(), same: !!((a && a.contains(e.target)) || (pop.src && pop.src.contains(e.target))) };
  closePop();
}, true);
document.addEventListener('click', e => {
  const t = e.target, a = t.closest('[data-act]');
  if (a) { act(a.dataset.act, a); return; }
  if (t.closest('.pop')) return;
  const ed = t.closest('[data-ed]'); if (ed) { beginEdit(ed, e); return; }
  const it = t.closest('.bar,.card'); if (it) { openTask(it.dataset.id); return; }
  const sd = t.closest('.row.task > .side'); if (sd) { openTask(sd.parentElement.dataset.id, 'side'); return; }
  const add = t.closest('.row.add > .track');
  if (add && P) { const d = Math.floor(dayF(e.clientX)), key = add.closest('.grp').dataset.group; addTask(Object.assign({ start: d, end: d + 4 }, ui.group === 'project' ? { project: key } : { who: key || null })); }
});
document.addEventListener('focusout', e => {
  const el = e.target;
  if (!busy && el.isContentEditable && el.dataset.ed) endEdit(el);
  else if (el.dataset && el.dataset.f) setTimeout(syncInsp, 0);
});
document.addEventListener('paste', e => {
  const el = e.target.closest && e.target.closest('.editing'); if (!el) return;
  e.preventDefault(); document.execCommand('insertText', false, (e.clipboardData.getData('text/plain') || '').replace(/\s+/g, ' '));
});
document.addEventListener('keydown', e => {
  const el = e.target, mod = e.metaKey || e.ctrlKey, k = e.key.toLowerCase();
  if (el.isContentEditable) {
    if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
    else if (e.key === 'Escape') { el.dataset.cancel = '1'; el.blur(); }
    return;
  }
  const field = /^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName), text = field && !/^(range|checkbox)$/.test(el.type);
  if (e.key === 'Escape') { closePop(); return; }
  if (e.key === 'Enter' && el.classList.contains('i-name')) { closePop(); return; }
  if (mod && !text && (k === 'z' || k === 'y')) { e.preventDefault(); if (k === 'y' || e.shiftKey) restore(redoS, undoS); else restore(undoS, redoS); return; }
  if (field || mod || e.altKey) return;
  if (e.key === 'Enter' && el.dataset && el.dataset.ed) { e.preventDefault(); beginEdit(el, null, true); return; }
  if (el.tagName === 'BUTTON' && (e.key === ' ' || e.key === 'Enter')) return;
  if (k === '1') setView('plan'); else if (k === '2') setView('board'); else if (k === '3') setView('people');
  else if (k === 't') act('today', document.body);
  else if (k === 'g' && ui.view === 'plan') { ui.group = ui.group === 'project' ? 'person' : 'project'; closePop(); save(); render(); }
  else if (k === 'n') { e.preventDefault(); addTask(ui.view === 'plan' && ui.group === 'person' ? { who: null } : {}); }
  else if ((e.key === 'Delete' || e.key === 'Backspace') && selId) delTask(selId);
});
view.addEventListener('wheel', e => {
  if (ui.view !== 'plan' || !P || !(e.ctrlKey || e.metaKey)) return;
  e.preventDefault();
  setZoom(P.dw * Math.exp(-e.deltaY * (Math.abs(e.deltaY) > 40 ? .003 : .012)), e.clientX - view.getBoundingClientRect().left - P.side);
  const z = $('.zoom'); if (z) z.value = Math.round(ui.dayW);
}, { passive: false });
let scrollRaf = 0;
view.addEventListener('scroll', () => {
  if (!dragging) hideTip();
  if (pop && !scrollRaf) scrollRaf = requestAnimationFrame(() => { scrollRaf = 0; placePop(); });
}, { passive: true });
let resizeT = 0;
addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(render, 80); });

/* ───────── boot ───────── */
const darkMQ = matchMedia('(prefers-color-scheme: dark)');
function theme() { document.documentElement.dataset.theme = ui.theme === 'dark' || (ui.theme !== 'light' && darkMQ.matches) ? 'dark' : 'light'; }
darkMQ.addEventListener('change', theme);

$('#undo').innerHTML = I.undo; $('#redo').innerHTML = I.redo; $('#more').innerHTML = I.dots;
if (!load()) data = sample();
if (!STATUS[ui.view] && !/^(plan|board|people)$/.test(ui.view)) ui.view = 'plan';
snap = JSON.stringify(data);
theme(); chrome(); render();
})();
